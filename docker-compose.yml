services:
    mc:
        image: itzg/minecraft-server:java17
        restart: unless-stopped
        stdin_open: true
        tty: true
        ports:
            - "25565:25565"
        volumes:
            - ./data:/data
        environment:
            # Server Settings
            TYPE: AUTO_CURSEFORGE
            VERSION: 1.20.1
            CF_SLUG: soulrend
            CF_API_KEY: ${CF_API_KEY}
            CF_EXCLUDE_MODS: epicfightcurioscompat  # Fix bug in pack
            EULA: true
            MOTD: "§4james screaming simulator 2"
            ICON: "https://media.forgecdn.net/avatars/thumbnails/1808/526/256/256/639144070150898549.png"
            ENABLE_WHITELIST: true
            ENABLE_AUTOPAUSE: true
            ENABLE_ROLLING_LOGS: true

            # Java Settings
            MEMORY: 16G
            JVM_OPTS: "-Dusing.aikars.flags=https://mcflags.emc.gs -Daikars.new.flags=true"
            JVM_XX_OPTS: >-
                -XX:+UnlockExperimentalVMOptions
                -XX:+UnlockDiagnosticVMOptions
                -XX:+AlwaysActAsServerClassMachine
                -XX:+AlwaysPreTouch
                -XX:+DisableExplicitGC
                -XX:+UseNUMA
                -XX:NmethodSweepActivity=1
                -XX:ReservedCodeCacheSize=400M
                -XX:NonNMethodCodeHeapSize=12M
                -XX:ProfiledCodeHeapSize=194M
                -XX:NonProfiledCodeHeapSize=194M
                -XX:-DontCompileHugeMethods
                -XX:MaxNodeLimit=240000
                -XX:NodeLimitFudgeFactor=8000
                -XX:+UseVectorCmov
                -XX:+PerfDisableSharedMem
                -XX:+UseFastUnorderedTimeStamps
                -XX:+UseCriticalJavaThreadPriority
                -XX:ThreadPriorityPolicy=1
                -XX:AllocatePrefetchStyle=3
                -XX:+UseG1GC
                -XX:+ParallelRefProcEnabled
                -XX:MaxGCPauseMillis=200
                -XX:G1NewSizePercent=30
                -XX:G1MaxNewSizePercent=40
                -XX:G1HeapRegionSize=32M
                -XX:G1ReservePercent=20
                -XX:G1HeapWastePercent=5
                -XX:G1MixedGCCountTarget=4
                -XX:InitiatingHeapOccupancyPercent=15
                -XX:G1MixedGCLiveThresholdPercent=90
                -XX:G1RSetUpdatingPauseTimePercent=5
                -XX:SurvivorRatio=32
                -XX:MaxTenuringThreshold=1

            # Gameplay Settings
            DIFFICULTY: hard
            MAX_PLAYERS: 16
            VIEW_DISTANCE: 16
            ALLOW_FLIGHT: true
            ENABLE_COMMAND_BLOCK: true
            SNOOPER_ENABLED: false
            SPAWN_PROTECTION: 0
            PLAYER_IDLE_TIMEOUT: 60
            MAX_TICK_TIME: -1
    mc-backup:
        image: itzg/mc-backup
        restart: unless-stopped
        depends_on:
            mc:
                condition: service_healthy
        environment:
            BACKUP_INTERVAL: "1h"
            PRUNE_BACKUPS_COUNT: 6
            PAUSE_IF_NO_PLAYERS: true
            RCON_HOST: mc
            INITIAL_DELAY: 0
            BACKUP_ON_STARTUP: false
        volumes:
            - ./data:/data:ro
            - ./backups:/backups

