services:
    mc:
        image: itzg/minecraft-server:java8-multiarch
        restart: unless-stopped
        stdin_open: true
        tty: true
        ports:
            - "25565:25565"
        volumes:
            - ./data:/data

        environment:
            # Java Settings
            MEMORY: 16G
            JVM_OPTS: "-Dusing.aikars.flags=https://mcflags.emc.gs -Daikars.new.flags=true"
            JVM_XX_OPTS: "-XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch -XX:G1NewSizePercent=40 -XX:G1MaxNewSizePercent=50 -XX:G1HeapRegionSize=16M -XX:G1ReservePercent=15 -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4 -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32 -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1"

            # Server Settings
            TYPE: AUTO_CURSEFORGE
            VERSION: 1.12.2
            CF_SLUG: rlcraft
            CF_API_KEY: ${CF_API_KEY}
            EULA: true
            MOTD: "§4james screaming simulator"
            ICON: "https://cdn.discordapp.com/emojis/1082064440150732961.webp?size=64"
            ENABLE_WHITELIST: true
            ENABLE_AUTOPAUSE: true

            # Gameplay Settings
            DIFFICULTY: hard
            MAX_PLAYERS: 16
            VIEW_DISTANCE: 16

            ENABLE_COMMAND_BLOCK: true
            SNOOPER_ENABLED: false
            SPAWN_PROTECTION: 0
            PLAYER_IDLE_TIMEOUT: 60
            MAX_TICK_TIME: -1
    mc-backup:
        image: itzg/mc-backup
        restart: unless-stopped
        depends_on:
            mc:
                condition: service_healthy
        environment:
            BACKUP_INTERVAL: "1h"
            PRUNE_BACKUPS_COUNT: 6
            PAUSE_IF_NO_PLAYERS: true
            RCON_HOST: mc
            INITIAL_DELAY: 0
            BACKUP_ON_STARTUP: false
        volumes:
            - ./data:/data:ro
            - ./backups:/backups

